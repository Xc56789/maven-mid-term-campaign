name: Rebuild campaign HTML

on:
  push:
    branches:
      - main
    paths:
      - 'content/campaign.json'
      - 'src/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Rebuild campaign materials and HTML
        run: python src/rebuild.py

      - name: Commit rebuilt materials and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html materials/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild campaign materials and HTML"
            git push
          fi
